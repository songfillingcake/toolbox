# 生产 / 团队内网部署建议 profile：mvn spring-boot:run -Dspring-boot.run.profiles=prod
# 或 java -jar dev-toolbox.jar --spring.profiles.active=prod

server.port=8088
# 仅监听本机，配合 Nginx 反代对外暴露
server.address=127.0.0.1

# 关闭 URL 代理拉取（防 SSRF 滥用）
devkit.fetch.enabled=false
devkit.fetch.allow-localhost=false

# 若前置 Nginx 在本机，可信任其地址以正确限流真实客户端 IP
devkit.trusted-proxies=127.0.0.1,::1
